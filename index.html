<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Your E-book / Download</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
        }
        .book-cover {
            width: 100%;
            max-width: 220px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: #ffffff;
        }
        p {
            font-size: 0.95rem;
            color: #94a3b8;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .btn-language {
            display: block;
            width: 100%;
            background: #3b82f6;
            color: white;
            padding: 14px 20px;
            margin-bottom: 12px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            transition: background 0.2s, transform 0.1s;
        }
        .btn-language:hover {
            background: #2563eb;
            transform: translateY(-2px);
        }
        .footer {
            margin-top: 20px;
            font-size: 0.8rem;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Substitua pelo link da imagem da capa do seu e-book -->
        <img src="https://via.placeholder.com/220x300" alt="E-book Cover" class="book-cover">
        
        <h1>Choose Your Language</h1>
        <p>Select your preferred language below to get instant access to the e-book.</p>

        <!-- TROQUE OS LINKS DOS BOTÕES PELOS SEUS LINKS DA GUMROAD DE CADA IDIOMA -->
        <a href="#" class="btn-language" target="_blank">🇺🇸 English</a>
        <a href="#" class="btn-language" target="_blank">🇪🇸 Español</a>
        <a href="#" class="btn-language" target="_blank">🇫🇷 Français</a>
        <a href="#" class="btn-language" target="_blank">🇩🇪 Deutsch</a>
        <a href="#" class="btn-language" target="_blank">🇧🇷 Português</a>

        <div class="footer">
            Instant Digital Download • Secure Checkout
        </div>
    </div>

</body>
</html>
